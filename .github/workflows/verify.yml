name: verify

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BRAIN_DIR: ${{ github.workspace }}/brain
      SITE_DIR: ${{ github.workspace }}/site
    steps:
      - uses: actions/checkout@v4
      # الشيفرة تستعمل صياغة Python 3.12 (شرطة مائلة داخل تعبير f-string في 9 ملفات)،
      # فكان 3.11 يُسقط البناء بخطأ صياغة قبل أي اختبار.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: حزم النظام
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: حزم بايثون
        # pytest تستدعيه run_checks.sh (python3 -m pytest) وليس في متطلبات التشغيل.
        run: pip install -r brain/requirements.txt pytest
      - name: متصفح Chromium (تدقيق الطباعة)
        run: python3 -m playwright install --with-deps chromium
      - name: اتساق المانيفست والكتيب
        run: python3 brain/tools/runbook.py verify --root brain
      - name: تصنيف مسارات المستودع
        run: python3 brain/tools/code_paths.py check --root .
      # الفحوص تشترط موقعًا مبنيًا في site/dist، والمجلد مستبعد من git، فيُبنى هنا من المصادر.
      - name: بناء الموقع
        working-directory: site
        run: python3 generator/build_site.py --check
      - name: الاختبارات
        run: bash brain/tests/run_checks.sh
