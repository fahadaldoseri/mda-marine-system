<!doctype html>
<!-- قالب نموذج «قبل/بعد» — RTL داكن. استبدل {{...}} ثم أخرجه صورة بمتصفح آلي.
     إن أدرجت شعارًا، ضمّنه base64 وتحقّق من تحميله (naturalWidth) قبل التسليم. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root{--bg:#040810;--panel:#0b1524;--panel2:#0f1d33;--line:#1b2b45;--ink:#e9f0f9;--ink2:#b9c8dc;
        --muted:#7f95ae;--gold:#c9a227;--gold2:#e8c766;--teal:#22c3b6;--red:#e0574f;--green:#3fae72}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:26px 22px 30px;
       font-family:"Noto Sans Arabic","Scheherazade",system-ui,sans-serif}
  h1.page{font-size:25px;margin:0 0 4px;text-align:center}
  p.sub{color:var(--muted);text-align:center;margin:0 0 22px;font-size:13.5px}
  .wrap{display:flex;gap:20px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  .col{width:700px}
  .colhead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .colhead b{font-size:19px}
  .tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .tag.new{border-color:var(--gold);color:var(--gold2)}
  .frame{border:1px solid var(--line);border-radius:16px;background:linear-gradient(#081020,#050b16);
         padding:12px;display:flex;flex-direction:column;gap:10px}
  .blk{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px}
  .blk.dim{background:#081221;border-style:dashed}
  .lbl{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
  .code{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);
        color:var(--gold2);background:#1a1607;white-space:nowrap}
  .code.del{border-color:#5b2320;color:#f0a09a;background:#241010}
  .note{font-size:11.5px;color:var(--muted);line-height:1.8}
  table{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--ink2);margin-top:14px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:right}
  th{background:#0a1322;color:var(--gold2)}
  .ok{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
</style>
</head>
<body>
<h1 class="page">{{TITLE}}</h1>
<p class="sub">{{SUBTITLE}} — الأرقام تشير إلى بنود الجرد · النموذج للعرض لا للتنفيذ</p>

<div class="wrap">
  <div class="col">
    <div class="colhead"><b>الوضع الآن</b><span class="tag">مقيس من المخرج</span></div>
    <div class="frame">
      {{BEFORE_BLOCKS}}
    </div>
  </div>

  <div class="col">
    <div class="colhead"><b>المقترح</b><span class="tag new">معتمد من المالك</span></div>
    <div class="frame">
      {{AFTER_BLOCKS}}
    </div>
  </div>
</div>

<table>
  <tr><th>القياس</th><th>الوضع الآن (مقيس)</th><th>بعد الإصلاح</th></tr>
  {{TABLE_ROWS}}
</table>

<div class="blk" style="margin-top:16px">
  <div class="lbl"><span>ما تغيّر — بإيجاز</span></div>
  <div class="note">{{SUMMARY_LINES}}</div>
</div>
</body>
</html>
